<!doctype html>
<html><head><meta charset="utf-8"><title>ERP door test</title>
<style>body{font:15px system-ui;max-width:560px;margin:40px auto;padding:0 16px}input,button{font:inherit;padding:8px;margin:4px 0;width:100%;box-sizing:border-box}pre{background:#f3f3f3;padding:10px;white-space:pre-wrap}</style>
</head><body>
<h2>ERP door test (this PC only)</h2>
<p>Sign in with your ERP email and password. Then press the buttons. Nothing is saved by "Read".</p>
<input id="em" placeholder="email" autocomplete="username">
<input id="pw" type="password" placeholder="password" autocomplete="current-password">
<button id="go">Sign in</button>
<button id="read" disabled>1. Read a list through the door</button>
<button id="fake" disabled>2. Try with a fake sign-in (should be refused)</button>
<pre id="out">Not signed in.</pre>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const auth = getAuth(initializeApp({ apiKey: 'AIzaSyCBHVKB0bXdawmz2dpAncrWonDZjfRjgqM', authDomain: 'price-research-48ff3.firebaseapp.com', projectId: 'price-research-48ff3' }));
const out = document.getElementById('out');
const show = o => { out.textContent = JSON.stringify(o, null, 2); window.__last = o; };
const post = (p, b) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(b) }).then(r => r.json());
document.getElementById('go').onclick = async () => {
  try {
    const u = await signInWithEmailAndPassword(auth, em.value.trim(), pw.value); pw.value = '';
    show({ signedIn: u.user.email }); read.disabled = fake.disabled = false;
  } catch (e) { show({ signInFailed: e.code || String(e) }); }
};
read.onclick = async () => {
  const t0 = performance.now();
  const r = await post('/erp/read', { idToken: await auth.currentUser.getIdToken(), path: 'pt_masters/greigeRfd' });
  show({ test: 'read', ok: r.ok, error: r.error, itemsInList: r.value && typeof r.value === 'object' ? Object.keys(r.value).length : r.value, ms: Math.round(performance.now() - t0) });
};
fake.onclick = async () => {
  const r = await post('/erp/read', { idToken: 'fake.token.here', path: 'pt_masters/greigeRfd' });
  show({ test: 'fake sign-in', ok: r.ok, error: r.error });
};
</script>
</body></html>
