<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopify · Ridhi Home &amp; Living</title>
<!-- The Shopify section, working against the local hub backend (server.js).
     Look: look.css (the approved design, matched to the live ERP's Shopify screens) + hub.css (what only the hub has:
     DHL CSB, Setup, FedEx). Rules shared with the backend: journey.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Libre+Caslon+Text:wght@400;700&display=swap">
<link rel="stylesheet" href="look.css?v=fce6229dbd">
<link rel="stylesheet" href="hub.css?v=90bae9dded">
<!-- Inside the ERP's "Shopify hub (test)" page (?embed=1) the ERP already shows its own menu bar. -->
<script>if (/[?&]embed=1\b/.test(location.search)) document.documentElement.classList.add('embed');</script>
</head>
<body data-page="orders">
<div class="s-proto" id="modeBar">Connecting to the local hub…</div>
<div class="shell">
  <header class="side">
    <div class="brand"><span class="brandname">Ridhi<span class="brandsub">Home &amp; Living</span></span></div>
    <div class="navwrap"><button class="navgrp here" type="button"><span class="caret">&#9656;</span> Shopify</button></div>
  </header>

  <main class="s-wrap">
    <!-- As on the live Shopify Orders screen: the blue band (name and store left, figures right), then the line of
         filters under it in the same card. The other pages keep only the filter line. -->
    <div class="s-head">
      <div class="s-band">
        <div class="s-title"><span>SHOPIFY <i class="s-testbadge" id="testBadge" hidden>TEST</i></span><b id="ptitle">Orders</b></div>
        <div class="seg" id="storeBand"></div>
        <div class="s-figs" id="figs"></div>
      </div>
      <!-- One row (Ravi, 2 Nov: "make the UI much better"): pages left, search in the middle, the two team buttons, and
           everything used now and then (live tracking, present, fetch now) in the ⋯ menu. -->
      <div class="s-tools">
        <nav class="s-tabs" id="tabs" aria-label="Shopify pages"></nav>
        <div class="seg s-barseg" id="storeBar"></div>
        <label class="s-search s-searchwide">
          <input id="q" type="search" placeholder="Search order, SKU, name or tracking" aria-label="Search" aria-keyshortcuts="/">
        </label>
        <button class="s-ordonly s-bucket" id="bucketBtn" type="button" title="Lines not yet routed to MCF, production or India">To route <b id="bucketN"></b></button>
        <button class="s-ordonly s-bucket" id="prodBktBtn" type="button" title="The ERP's production bucket: need production, stock can fill, done, from production, handed over — open production lines (SHP-) in the Order Console">Production bucket</button>
        <button class="s-ordonly s-bulkbtn" id="bulkBtn" type="button" title="Every order with something ready to ship (made, or in India stock): tick, weigh, make the DHL / FedEx files">Bulk order <b id="bulkN"></b></button>
        <details class="s-moremenu" id="moreMenu">
          <summary title="More" aria-label="More">⋯</summary>
          <div class="s-menu">
            <span class="s-ordonly s-stockat" id="trackAt"></span>
            <span class="s-stockat" id="fetchAt"></span>
            <button class="s-ordonly s-fetch" id="fetchBtn" type="button">Fetch orders now</button>
            <button class="s-live on" id="liveBtn" type="button"><i></i>Live tracking · on</button>
            <button class="s-tbtn" id="present" type="button" title="Plays the whole flow on a demo order, step by step, with captions (and voice if you turn it on)">▶ Present</button>
          </div>
        </details>
      </div>
    </div>

    <!-- The current page is drawn here by app.js. -->
    <div id="page"><div class="s-card s-empty">Loading…</div></div>
  </main>
</div>

<nav class="s-bottom" id="bottom" aria-label="Shopify pages"></nav>
<div id="dlg"></div>
<div id="tourHost"></div>
<script src="journey.js?v=1a5d07b5e0"></script>
<script src="hub-web.js?v=6923330cd3"></script>
<script src="app.js?v=5426e4d5fc"></script>
</body>
</html>
