# MEERA'S ROUTER GOES TO CLOUDFLARE FROM GITHUB (Ravi, 26 Oct: "cloud ya git pe rakh de taaki hamesha chalta rahe").
#
#   main   a push that changes meera/router/ (Meera's router, moved there 29 Oct) is tested, then deployed to Cloudflare as the Worker "meera-router",
#          its D1 tables made (safe to repeat) and its keys set from this repository's secrets.
#
# Nothing is deployed when a test fails, or while the Cloudflare secrets are missing (the tests still run and say so).
# The ERP itself is not touched by this workflow (replenish-hosting.yml does the ERP).
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Workers Scripts: Edit" and "D1: Edit"
#   GROQ_API_KEY           from console.groq.com (free) — or typed straight into Cloudflare instead
#   GEMINI_API_KEY         from aistudio.google.com (free; optional — without it Gemini is skipped)
name: Meera router — test, deploy

on:
  # HELD BACK (Ravi, 2 Nov 2026). Free plan, search parked (master plan step B.1): on Ravi's "live karo" the router is
  # deployed BY HAND — GitHub → Actions → "Meera router — test, deploy" → Run workflow (on main). Until then
  # nothing here deploys by itself.
# push:
#   branches: [main]
#   # Phase 5: her search runs on the router too — a change to her answers or her search code redeploys it
#   paths: ['meera/router/**', 'meera/client/src/legacy/guide-ai.*', '.github/workflows/meera-router.yml',
#           'meera/client/src/understand.ts', 'meera/client/src/legacy/guide-ask.*', 'meera/client/src/legacy/guide-tours.*',
#           'Replenish-App/public/guide/meera-bank.json', 'Replenish-App/public/guide/meera-walks.json', 'Replenish-App/public/guide/meera-words.bin']
  workflow_dispatch:

concurrency:
  group: meera-router
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_METER: ${{ secrets.MEERA_METER_KEY != '' && secrets.MEERA_STOP_KEY != '' }}
    defaults:
      run:
        working-directory: meera/router
    steps:
      - uses: actions/checkout@v4

      # node:sqlite (the tests' stand-in for D1) needs a recent Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests (no internet, no accounts)
        run: |
          node test/router.test.mjs
          node test/same-cleaning.test.mjs

      - name: The D1 database ID is filled in
        if: env.HAS_CF == 'true'
        run: |
          if grep -q 'PUT-THE-D1-DATABASE-ID-HERE' wrangler.toml; then
            echo "::error::Make the D1 database 'meera' in Cloudflare and put its ID in meera/router/wrangler.toml"; exit 1; fi

      - name: D1 tables (only what is missing)
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: meera/router
          command: d1 execute meera --remote --file=schema.sql

      # Phase 5: her answers and walk-throughs into the database (the server's search reads them; kb_version goes up).
      # Not on the free plan (SEARCH = "parked" in wrangler.toml): nothing would read them.
      - name: Is her search on the server parked (free plan)?
        id: plan
        run: if grep -q '^SEARCH = "parked"' wrangler.toml; then echo "parked=yes" >> "$GITHUB_OUTPUT"; else echo "parked=no" >> "$GITHUB_OUTPUT"; fi
      - name: Her answers into D1
        if: env.HAS_CF == 'true' && steps.plan.outputs.parked != 'yes'
        run: node kb-sql.cjs > kb.sql
      - name: D1 answers (replaced)
        if: env.HAS_CF == 'true' && steps.plan.outputs.parked != 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: meera/router
          command: d1 execute meera --remote --file=kb.sql

      # Wrangler run straight, so that on a failure its own error lines become notes on the run that anyone can read
      # (GitHub shows a step's full log only to someone signed in).
      - name: Deploy the Worker
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npx --yes wrangler@3 deploy > deploy.log 2>&1
          code=$?
          cat deploy.log
          if [ $code -ne 0 ]; then
            grep -iE 'error|✘|subdomain|workers\.dev|permission|authentication|not found|code: ' deploy.log | head -15 | sed 's/^/::error::/'
            exit $code
          fi
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 | sed 's/^/::notice::Meera router address: /'

      # A key goes to Cloudflare only when it is in GitHub: a key typed straight into Cloudflare is never blanked.
      - name: Groq key (only if it is in GitHub)
        if: env.HAS_CF == 'true' && env.HAS_GROQ == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: meera/router
          command: deploy
          secrets: |
            GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Her search on Cloud Functions (D.2): the meter's key and the cent alarm's key — the same two are in
      # meera/functions/.env on the office computer (never in the repository)
      - name: Meter and alarm keys (only if they are in GitHub)
        if: env.HAS_CF == 'true' && env.HAS_METER == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: meera/router
          command: deploy
          secrets: |
            METER_KEY
            STOP_KEY
        env:
          METER_KEY: ${{ secrets.MEERA_METER_KEY }}
          STOP_KEY: ${{ secrets.MEERA_STOP_KEY }}

      - name: Gemini key (only if it is in GitHub)
        if: env.HAS_CF == 'true' && env.HAS_GEMINI == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: meera/router
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # The new router answers: GET /health (no sign-in, no data) gives the version in src/worker.js and the search state
      - name: Health check
        if: env.HAS_CF == 'true'
        run: |
          want=$(grep -oE "ROUTER_VERSION = '[^']+'" src/worker.js | cut -d"'" -f2)
          for i in 1 2 3 4 5 6; do
            got=$(curl -s -m 10 https://meera-router.erp-9a0.workers.dev/health)
            echo "$got"
            if echo "$got" | grep -q "\"v\":\"$want\""; then echo "::notice::Meera router $want is answering: $got"; exit 0; fi
            sleep 10
          done
          echo "::error::The router did not answer as $want — roll back: Cloudflare → Workers & Pages → meera-router → Deployments → the previous one → Rollback"; exit 1

      - name: No Cloudflare key yet
        if: env.HAS_CF != 'true'
        run: echo "::warning::No Cloudflare secrets are set — the tests ran, nothing was deployed."
