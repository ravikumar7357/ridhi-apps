# THE TEST ERP CHECK: every push to dev still builds the test ERP (saving off), but no longer publishes it.
# Ravi, 29 Oct: the GitHub Pages link carries R-one only —
#   https://ravikumar7357.github.io/ridhi-apps/replenish/
# is published from the preview/r-one branch (its own test-erp.yml). A dev push used to publish over it.
# The real ERP is not touched: it still goes live from main only.
# What the build changes in its own copy (and only there) is explained in Replenish-App/tests/build-test-erp.js.
name: test ERP

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-erp-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pages match their source
        run: |
          node Replenish-App/tests/assemble.js --check
          node Replenish-App/tests/assemble.js --root Pricing-App --check
      - name: Build the test ERP (saving off)
        run: node Replenish-App/tests/build-test-erp.js
