# THE REPLENISH APP GOES LIVE FROM GITHUB (Ravi, 22 Oct: "mujhe abhi ka firebase host direct github ki main branch se krna hai").
#
#   main          every push that touches Replenish-App/ (or shared/) is tested and built, NOT put live.
#                 TWO RELEASES A DAY (Ravi, 12 Nov): at 1:17 pm and 6:47 pm India time (off the half hour, when GitHub's timer is on time) GitHub puts whatever main has on
#                 the live site, https://fabricrush-replenish.web.app — only if main changed since the last release
#                 (the tag live-site marks what is live), so open ERP tabs reload at most twice a day.
#                 URGENT FIX: Actions → "Replenish app — test, build, deploy" → Run workflow → branch main,
#                 tick "Put it live now" → Run. GitHub's timer can start 5–30 minutes late.
#   preview/<x>   a branch named preview/something gets its own test link (30 days), the live site untouched — the way
#                 a feature waits for Ravi's "live karo". Merging it into main puts it live.
#
# Nothing is deployed when a test fails. The key is the repository secret FIREBASE_SERVICE_ACCOUNT, or the
# FIREBASE_SERVICE_ACCOUNT_PRICE_RESEARCH_48FF3 that `firebase init hosting:github` makes; without one the tests and the
# build still run and say so, and nothing is deployed.
# Set up 22 Oct by `firebase init hosting:github`: service account github-action-1397622174 (Firebase Hosting Admin), its key in
# the secret FIREBASE_SERVICE_ACCOUNT_PRICE_RESEARCH_48FF3. The workflow file that command writes is not used — this one is.
name: Replenish app — test, build, deploy

on:
  push:
    branches: [main, 'preview/**']
    paths: ['Replenish-App/**', 'shared/**', 'meera/**', '.github/workflows/replenish-hosting.yml']
  schedule:
    - cron: '47 7 * * *'    # 1:17 pm India time (07:47 UTC)
    - cron: '17 13 * * *'   # 6:47 pm India time (13:17 UTC)
  workflow_dispatch:
    inputs:
      live_now:
        description: 'Put it live now (urgent fix) — only works on branch main'
        type: boolean
        default: false

# one deploy at a time per branch; a newer push waits for the one running, it does not cut it short
concurrency:
  group: replenish-hosting-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # to move the live-site tag after a release
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # only WHETHER a key is there — the key itself goes to the deploy steps alone, never into the install or test steps
      HAS_KEY: ${{ (secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PRICE_RESEARCH_48FF3) != '' }}
    defaults:
      run:
        working-directory: Replenish-App
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Meera's gate compares this push with the commit before it

      # RELEASE OR NOT: only the 1:17 / 6:47 timer, or "Put it live now", on main, puts the site live — and the timer
      # only when main has moved since the live-site tag. A plain push to main stops after the tests and the build.
      - name: Release now?
        id: rel
        working-directory: .
        run: |
          go=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.live_now }}" = "true" ]; then go=true; fi
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              git fetch -q --tags origin || true
              live=$(git rev-parse -q --verify "refs/tags/live-site^{commit}" || echo none)
              if [ "$live" != "$GITHUB_SHA" ]; then go=true; else echo "Nothing new on main since the last release."; fi
            fi
          fi
          base=$(git rev-parse -q --verify "refs/tags/live-site^{commit}" || echo "${{ github.event.before }}")
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Release to the live site: $go"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Replenish-App/package-lock.json

      - name: Install
        run: npm ci

      # shop-test opens the Excel the app writes with a real spreadsheet library (openpyxl)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install openpyxl
        run: python3 -m pip install --quiet openpyxl

      - name: The page is what src/ makes
        run: node tests/assemble.js --check

      # MEERA KEEPS UP WITH THE SCREENS (switch "autobank", 2 Nov 2026) — a REPORT only, in this run's summary: what autobank
      # would add, rename or take out. It never changes what is deployed here, so the live site never drifts from the
      # repository; its changes come as a pull request to approve (meera-autobank.yml).
      - name: Meera — her answers and the screens (report)
        run: node ../meera/tools/autobank.cjs --ci

      # prod-test is not here: it reads a backup of the live production data (C:/AMAZON/backups/…), which never goes to
      # GitHub — this repository is public. It is run on the office computer before every push to main.
      - name: Tests
        run: |
          set -e
          for t in flow shop pack-scan pack-verify pack-core barcode-read barcode-wasm appv b2b-pictures repl-master replsnap; do
            if node "tests/$t-test.js" > "/tmp/$t.log" 2>&1; then echo "$t: $(tail -1 /tmp/$t.log)"
            else echo "::error::$t-test failed"; grep -E "FAIL|Error" "/tmp/$t.log" | head -40; tail -5 "/tmp/$t.log"; exit 1; fi
          done

      # MEERA'S GATE (v2 rebuild, 29 Oct 2026): meera/tests/ci-gate.cjs. When this push touches Meera (meera/, her answers,
      # the bridge) or a screen box she points at, it can block the deploy if she got worse, with a plain message saying
      # which check failed and why; any other ERP change only gets a warning, so an urgent fix is never stuck. A meant
      # change: node meera/tests/gate.cjs --accept "why", commit meera/bank/baseline/.
      - name: Meera — never-break list and no-worse gate
        env:
          MEERA_BASE: ${{ steps.rel.outputs.base }}
        run: node ../meera/tests/ci-gate.cjs

      - name: Build the deployed copy (dist/)
        run: node tests/build-dist.js

      - name: Deploy — live site
        if: github.ref == 'refs/heads/main' && steps.rel.outputs.go == 'true' && env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PRICE_RESEARCH_48FF3 }}
          projectId: price-research-48ff3
          channelId: live
          entryPoint: Replenish-App

      - name: Mark what is live (tag live-site)
        if: github.ref == 'refs/heads/main' && steps.rel.outputs.go == 'true' && env.HAS_KEY == 'true'
        working-directory: .
        run: git tag -f live-site "$GITHUB_SHA" && git push -f origin refs/tags/live-site

      - name: Waiting for the next release
        if: github.ref == 'refs/heads/main' && steps.rel.outputs.go != 'true'
        run: echo "::notice::Tested and built. Goes live at the next 1:17 pm or 6:47 pm release, or with Run workflow → Put it live now."

      - name: Test link name
        id: ch
        if: startsWith(github.ref, 'refs/heads/preview/')
        run: echo "name=$(echo "${GITHUB_REF_NAME#preview/}" | tr -c 'a-zA-Z0-9-' '-' | cut -c1-30 | sed 's/-*$//')" >> "$GITHUB_OUTPUT"

      - name: Deploy — test link
        if: startsWith(github.ref, 'refs/heads/preview/') && env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PRICE_RESEARCH_48FF3 }}
          projectId: price-research-48ff3
          channelId: ${{ steps.ch.outputs.name }}
          expires: 30d
          entryPoint: Replenish-App

      - name: No deploy key yet
        if: env.HAS_KEY != 'true'
        run: echo "::warning::No Firebase key secret is set — the tests and the build ran, nothing was deployed."
