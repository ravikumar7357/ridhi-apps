# SELLORA'S BACKEND GOES LIVE FROM GITHUB (Ravi, 21 Nov: "host the backend in github main and then it would be live").
#
#   every push / pull request touching Sellora-Backend/   build + tests (no keys needed: every outside service is faked)
#   main                                                  then deployed to Firebase (price-research-48ff3, codebase
#                                                         "sellora-live") — only that codebase: the rone-capture functions
#                                                         are never touched from here.
#
# Deploy key: the GitHub secret SELLORA_BACKEND_DEPLOY_KEY — a Google service account key (JSON) on price-research-48ff3 with:
# Cloud Functions Admin, Cloud Run Admin, Service Account User, Cloud Scheduler Admin, Secret Manager Admin, Artifact
# Registry Administrator, Cloud Build Editor, Service Usage Consumer (a missing one is named in the deploy log).
# Kept apart from the hosting key on purpose. Without it the tests still run and
# nothing is deployed. The API keys themselves are NOT here: they live in Firebase's Secret Manager (see Sellora-Backend/README.md).
name: Sellora backend — test, deploy

on:
  push:
    branches: [main, 'sellora-backend']
    paths: ['Sellora-Backend/**', '.github/workflows/sellora-backend.yml']
  pull_request:
    paths: ['Sellora-Backend/**', '.github/workflows/sellora-backend.yml']
  workflow_dispatch:

concurrency:
  group: sellora-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Sellora-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build (TypeScript → lib/)
        run: npm run build
      - name: Tests
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEY: ${{ secrets.SELLORA_BACKEND_DEPLOY_KEY != '' }}
    defaults:
      run:
        working-directory: Sellora-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: No deploy key yet
        if: env.HAS_KEY != 'true'
        run: echo "::warning::SELLORA_BACKEND_DEPLOY_KEY is not set — tests passed, nothing was deployed."
      - name: Deploy to Firebase (codebase sellora-live only)
        if: env.HAS_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SELLORA_BACKEND_DEPLOY_KEY }}
        run: |
          printf '%s' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/deploy-key.json"
          npx --yes firebase-tools@14 deploy --only functions:sellora-live --project price-research-48ff3 --non-interactive --force
          rm -f "$RUNNER_TEMP/deploy-key.json"
