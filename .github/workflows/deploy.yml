# Hosting from GitHub, so every release is a recorded run of what is in the repository — never whatever happens to
# be on someone's computer. See RELEASE.md.
#
#   push to dev        → both apps on a PREVIEW link (channel "dev", kept 30 days). The link is printed in the run.
#                        A preview link reads and writes the LIVE database: use it to look, and use TEST orders only.
#   "Run workflow"     → LIVE. Only from main, only by pressing the button: GitHub → Actions → deploy → Run workflow →
#                        branch main → target live. Nothing goes live by itself.
#
# Needs one secret (GitHub → Settings → Secrets and variables → Actions): FIREBASE_SERVICE_ACCOUNT, the JSON key of a
# Firebase service account with the "Firebase Hosting Admin" role. Without it this workflow stops at the first step and
# deploys nothing. Only hosting is deployed here: database rules and Apps Script keep their own careful tools.
name: deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [preview, live]
        default: preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'live' }}
    steps:
      - name: Live deploys come from main only
        if: env.LIVE == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "A live deploy must be run from the main branch. This run was started from ${GITHUB_REF}."
          exit 1

      - name: The deploy key is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT is not set — nothing deployed. See RELEASE.md."; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Same checks as every pull request
        run: |
          node Replenish-App/tests/assemble.js --check
          node Replenish-App/tests/assemble.js --root Pricing-App --check
          node Replenish-App/tests/gs-syntax-test.js

      - name: Build the Replenish page (dist/)
        working-directory: Replenish-App
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2
          node tests/build-dist.js

      - name: Replenish app → ${{ env.LIVE == 'true' && 'LIVE' || 'preview' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: price-research-48ff3
          entryPoint: Replenish-App
          channelId: ${{ env.LIVE == 'true' && 'live' || 'dev' }}
          expires: 30d

      - name: Sellora → ${{ env.LIVE == 'true' && 'LIVE' || 'preview' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: price-research-48ff3
          entryPoint: Pricing-App
          channelId: ${{ env.LIVE == 'true' && 'live' || 'dev' }}
          expires: 30d
